name: Build and Push React to GHCR

on:
  push:
    branches:
      - feat/k3s-deployment  # 當你 push 到 main 分支時自動執行

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: rayyau999

jobs:
  build-and-push-react:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 登入 GHCR（使用內建的 GITHUB_TOKEN，免密碼配置）
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      # 設定 Docker Buildx（支援多平台 & 快取）
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 開始打包並推送 React Image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # 同時打上 latest 標籤以及當前 Git Commit 的雜湊值（方便追溯版本）
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/my-eshop-app:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/my-eshop-app:${{ github.sha }}

  deploy:
    needs: build-and-push-react
    runs-on: [self-hosted, k3s-server]
    env:
      WEB_TAG: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy React to K3s
        run: |
          set -e
          echo "WEB_TAG=$WEB_TAG"

          # 用 envsubst 把 ${WEB_TAG} 替換進 yaml 再 apply
          envsubst < eShopWebDeployment.yaml | kubectl apply -f -
          kubectl apply -f eShopWebService.yaml

          # 等待 rollout 完成
          kubectl rollout status deployment/e-shop-web --timeout=300s
